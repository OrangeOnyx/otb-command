  <defs><filter id="cc-sshadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0.12" dy="0.12" stdDeviation="0.12" flood-color="#3B342A" flood-opacity=".16"/></filter></defs>
