<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cypress Command Punch List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;background:#EDEFE8}@media (prefers-color-scheme:dark){body{background:#151B18}}</style>
<style id="punch-css">
  :root{

    --line:#C7CDC1; --rule:#1C2B26;
    --brass:#A87E2F; --green:#2F6B4F; --anchor:#1E4F3C; --brick:#C25E33;
    --green-tint:rgba(47,107,79,.10); --brass-tint:rgba(168,126,47,.12);
    --brick-tint:rgba(194,94,51,.10); --slate-tint:rgba(95,110,100,.10);
    --hatch:rgba(28,43,38,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#151B18; --card:#1C2420; --ink:#E7EAE0; --soft:#9AA79E;
      --line:#2E3833; --rule:#9AA79E;
      --brass:#C99C50; --green:#6FA98A; --anchor:#8CC3A8; --brick:#D8815B;
      --green-tint:rgba(111,169,138,.14); --brass-tint:rgba(201,156,80,.14);
      --brick-tint:rgba(216,129,91,.13); --slate-tint:rgba(154,167,158,.10);
      --hatch:rgba(231,234,224,.25);
    }
  }
  :root[data-theme="dark"]{
    --paper:#151B18; --card:#1C2420; --ink:#E7EAE0; --soft:#9AA79E;
    --line:#2E3833; --rule:#9AA79E;
    --brass:#C99C50; --green:#6FA98A; --anchor:#8CC3A8; --brick:#D8815B;
    --green-tint:rgba(111,169,138,.14); --brass-tint:rgba(201,156,80,.14);
    --brick-tint:rgba(216,129,91,.13); --slate-tint:rgba(154,167,158,.10);
    --hatch:rgba(231,234,224,.25);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:400 16px/1.6 "Public Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding:clamp(12px,3vw,40px);
  }
  .sheet{
    position:relative; max-width:1060px; margin:0 auto;
    border:2px solid var(--rule); background:var(--paper);
    padding:clamp(20px,4vw,52px);
  }
  .sheet::before{
    content:""; position:absolute; inset:7px; border:1px solid var(--line);
    pointer-events:none;
  }
  .mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass); font-weight:500;
  }
  header.masthead{border-bottom:2px solid var(--rule); padding-bottom:22px; margin-bottom:26px;}
  .mast-row{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:baseline; justify-content:space-between;}
  h1{
    font-family:"Big Shoulders Display",sans-serif; font-weight:700;
    font-size:clamp(46px,8vw,84px); line-height:.95; letter-spacing:.01em;
    margin:10px 0 8px; text-transform:uppercase; text-wrap:balance;
  }
  .mast-date{color:var(--soft); font-size:12px; letter-spacing:.1em; text-transform:uppercase;}
  .lede{max-width:62ch; color:var(--soft); margin:0; font-size:15.5px;}
  .kpis{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));
    gap:0; border:1px solid var(--rule); margin:26px 0 8px; background:var(--card);
  }
  .kpi{padding:16px 18px 14px; border-right:1px solid var(--line);}
  .kpi:last-child{border-right:0}
  .kpi b{
    display:block; font-family:"Big Shoulders Display",sans-serif; font-weight:600;
    font-size:38px; line-height:1; margin:4px 0 2px; font-variant-numeric:tabular-nums;
  }
  .kpi small{color:var(--soft); font-size:12.5px; line-height:1.4; display:block;}
  @media (max-width:640px){ .kpi{border-right:0; border-bottom:1px solid var(--line);} .kpi:last-child{border-bottom:0} }
  section{margin-top:44px;}
  .schedule-label{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; border-bottom:1px solid var(--rule); padding-bottom:8px; margin-bottom:18px;}
  h2{
    font-family:"Big Shoulders Display",sans-serif; font-weight:600; font-size:30px;
    letter-spacing:.02em; text-transform:uppercase; margin:0;
  }
  .sched-count{margin-left:auto; color:var(--soft); font-size:12px; letter-spacing:.08em;}
  .chip{
    display:inline-block; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
    padding:3px 9px 2px; border:1px solid currentColor; white-space:nowrap;
  }
  .chip.done{color:var(--green); background:var(--green-tint);}
  .chip.open{color:var(--brass); background:var(--brass-tint);}
  .chip.hot{color:var(--brick); background:var(--brick-tint);}
  .chip.wait{color:var(--soft); background:var(--slate-tint);}
  .card{background:var(--card); border:1px solid var(--line); padding:20px 22px;}
  .card p{margin:.5em 0; max-width:72ch;}
  .card p:first-child{margin-top:0}
  code{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.88em;
    background:var(--slate-tint); padding:1px 5px; border:1px solid var(--line);
  }
  .tasks{margin-top:12px; border-top:1px dashed var(--line);}
  .task{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line);}
  .task .tname{font-weight:500; font-size:14.5px; flex:1; min-width:min(260px,100%);}
  .task[data-s="done"] .tname{opacity:.55; text-decoration:line-through; text-decoration-thickness:1px;}
  .smokes{display:flex; flex-direction:column; gap:10px;}
  .smoke{
    background:var(--card); border:1px solid var(--line);
    border-left:3px solid transparent; padding:14px 18px;
  }
  .smoke[data-s="pass"]{border-left-color:var(--green);}
  .smoke[data-s="pass"] .name, .smoke[data-s="pass"] .desc{opacity:.6;}
  .smoke[data-s="fail"]{border-left-color:var(--brick); background:var(--brick-tint);}
  .smoke .head{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline; margin-bottom:2px;}
  .smoke .name{font-weight:600; font-size:15.5px;}
  .smoke .desc{color:var(--soft); font-size:14px; margin:0; max-width:76ch;}
  .ctrl{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-top:12px;}
  .seg{display:inline-flex; border:1px solid var(--line); background:var(--card);}
  .seg button, .pick button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; padding:6px 13px 5px;
    background:transparent; color:var(--soft); border:0; border-right:1px solid var(--line);
    cursor:pointer; transition:background .15s,color .15s;
  }
  .seg button:last-child{border-right:0}
  .seg button:focus-visible, .pick button:focus-visible{outline:2px solid var(--brass); outline-offset:-2px;}
  .seg button[aria-pressed="true"].b-open{background:var(--slate-tint); color:var(--ink);}
  .seg button[aria-pressed="true"].b-pass{background:var(--green); color:var(--card);}
  .seg button[aria-pressed="true"].b-fail{background:var(--brick); color:var(--card);}
  .seg button[aria-pressed="true"].b-next{background:var(--brass); color:#fff;}
  .seg button[aria-pressed="true"].b-q{background:var(--slate-tint); color:var(--ink);}
  .seg button[aria-pressed="true"].b-hold{background:var(--soft); color:var(--card);}
  .seg button:disabled, .pick button:disabled{cursor:default; opacity:.55}
  .pick{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); background:var(--card); max-width:100%;}
  .pick button{text-transform:none; letter-spacing:.03em; font-size:12px; padding:7px 13px 6px;}
  .pick button:last-child{border-right:0}
  .pick button[aria-pressed="true"]{background:var(--green); color:var(--card);}
  .pick button[aria-pressed="true"].b-und{background:var(--slate-tint); color:var(--ink);}
  .stamp{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft);}
  .stamp.pass, .stamp.done{color:var(--green);} .stamp.fail{color:var(--brick);}
  .note{
    flex:1; min-width:min(240px,100%); font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12.5px; color:var(--ink); background:transparent; border:0;
    border-bottom:1px dashed var(--line); padding:5px 2px;
  }
  .note:focus{outline:none; border-bottom:1px solid var(--brass);}
  .note::placeholder{color:var(--soft); opacity:.75}
  .note:disabled{opacity:.55}
  .memo{
    width:100%; min-height:120px; resize:vertical;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px; line-height:1.7;
    color:var(--ink); background:var(--card); border:1px solid var(--line); padding:14px 16px;
  }
  .memo:focus{outline:none; border-color:var(--brass);}
  .memo::placeholder{color:var(--soft); opacity:.75}
  .memo:disabled{opacity:.55}
  .smoke-note{color:var(--soft); font-size:12px; margin-top:10px; max-width:80ch;}
  .savebar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:20;
    display:none; align-items:center; gap:8px 14px; flex-wrap:wrap;
    background:var(--ink); color:var(--paper); border:1px solid var(--rule);
    padding:10px 12px 10px 18px; max-width:min(92vw,640px);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
  }
  .savebar.on{display:flex}
  .savebar .msg{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; letter-spacing:.03em;}
  .savebar button{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--paper);
    background:transparent; color:var(--paper); padding:7px 14px 6px; cursor:pointer;
  }
  .savebar button.primary{background:var(--brass); border-color:var(--brass); color:#fff;}
  .savebar button:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  .savebar button:disabled{opacity:.6; cursor:default}
  .waves{border-left:2px solid var(--rule); margin-left:8px; padding-left:0;}
  .wave{position:relative; padding:0 0 26px 26px;}
  .wave:last-child{padding-bottom:4px;}
  .wave::before{
    content:""; position:absolute; left:-6px; top:8px; width:10px; height:10px;
    background:var(--paper); border:2px solid var(--soft); border-radius:50%;
  }
  .wave.done::before{background:var(--green); border-color:var(--green);}
  .wave.hot::before{background:var(--brick); border-color:var(--brick);}
  .wave.gated::before{background:var(--paper); border-color:var(--brick);}
  .wave .head{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:baseline;}
  .wave .wid{font-family:"IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:13px; letter-spacing:.06em;}
  .wave .wname{font-weight:600; font-size:16px;}
  .wave p{color:var(--soft); font-size:14.5px; margin:4px 0 0; max-width:74ch;}
  .wave .data{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; color:var(--soft);
    margin-top:6px; letter-spacing:.02em;
  }
  .decisions{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:12px;}
  .decision{background:var(--card); border:1px solid var(--line); border-top:3px solid var(--brick); padding:16px 18px;}
  .decision[data-decided="1"]{border-top-color:var(--green);}
  .decision[data-decided="1"] .did{color:var(--green);}
  .decision .head{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:baseline; margin-bottom:6px;}
  .decision .head .stamp{margin-left:auto}
  .decision .did{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; font-weight:500;
    color:var(--brick); letter-spacing:.08em;
  }
  .decision .q{font-weight:600; font-size:15.5px;}
  .decision p{color:var(--soft); font-size:14px; margin:.4em 0;}
  .decision .ctrl{margin-top:12px;}
  .decision .unblocks{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
    color:var(--anchor); letter-spacing:.04em; margin-top:10px;
  }
  .parked{margin-top:14px; color:var(--soft); font-size:13.5px; max-width:76ch;}
  .reg-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr));
    gap:6px; margin-bottom:14px;
  }
  .cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:13px; font-weight:500;
    border:1px solid var(--line); color:var(--ink); background:var(--card); cursor:default;
  }
  .cell.done{background:var(--green); border-color:var(--green); color:var(--card);}
  .cell.parity{border:2px solid var(--green); color:var(--green); background:var(--green-tint);}
  .cell.port{border:2px solid var(--brass); color:var(--brass); background:var(--brass-tint);}
  .cell.rebuild{background:var(--slate-tint); color:var(--soft);}
  .cell.ref{
    color:var(--soft);
    background:repeating-linear-gradient(45deg,transparent 0 4px,var(--hatch) 4px 5px);
  }
  .legend{display:flex; flex-wrap:wrap; gap:10px 22px; font-size:12.5px; color:var(--soft); margin-bottom:14px;}
  .legend span{display:inline-flex; align-items:center; gap:7px;}
  .sw{width:14px; height:14px; flex:none; border:1px solid var(--line); background:var(--card);}
  .sw.done{background:var(--green); border-color:var(--green);}
  .sw.parity{border:2px solid var(--green); background:var(--green-tint);}
  .sw.port{border:2px solid var(--brass); background:var(--brass-tint);}
  .sw.rebuild{background:var(--slate-tint);}
  .sw.ref{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--hatch) 4px 5px);}
  details.reg-index{border:1px solid var(--line); background:var(--card);}
  details.reg-index summary{
    cursor:pointer; padding:10px 16px; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--brass);
  }
  details.reg-index summary:focus-visible{outline:2px solid var(--brass); outline-offset:-2px;}
  .reg-list{
    columns:2; column-gap:36px; padding:4px 18px 16px; margin:0; list-style:none;

  .reg-list li{break-inside:avoid; color:var(--soft);}
  .reg-list b{color:var(--ink); font-weight:500;}
  .reg-list .st{float:right; font-size:10.5px; letter-spacing:.08em;}
  .st.g{color:var(--green)} .st.b{color:var(--brass)} .st.s{color:var(--soft)}

  .bl-group{background:var(--card); border:1px solid var(--line); padding:16px 18px 6px; margin-bottom:12px;}
  .bl-group[data-tier="1"]{border-left:3px solid var(--green);}
  .bl-group[data-tier="2"]{border-left:3px solid var(--brick);}
  .bl-group[data-tier="3"]{border-left:3px solid var(--soft);}

  .bl-head .bl-title{font-weight:600; font-size:15.5px;}
  .bl-head .chip{margin-left:auto}
  .bl-list{list-style:none; margin:0; padding:0;}
  .bl-list li{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:baseline; padding:9px 0; border-bottom:1px dashed var(--line);}
  .bl-list li:last-child{border-bottom:0}
  .bl-list .bid{font-family:"IBM Plex Mono",ui-monospace,monospace; font-weight:500; font-size:12.5px; letter-spacing:.06em; color:var(--brass); padding-top:2px;}
  .bl-list .bname{font-weight:500; font-size:14.5px;}
  .bl-list .bname .chip{margin-left:8px; vertical-align:middle;}
  .bl-list .bdesc{grid-column:2; color:var(--soft); font-size:13.5px; margin:0; max-width:78ch;}
  details.archive{border:1px dashed var(--line); margin-top:12px;}
  details.archive summary{
    cursor:pointer; padding:8px 14px; font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--soft);
  }
  details.archive summary:focus-visible{outline:2px solid var(--brass); outline-offset:-2px;}
  .arch-list{list-style:none; margin:0; padding:0 14px 10px;}
  .arch-list li{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; padding:7px 0; border-top:1px dashed var(--line); font-size:13.5px;}
  .arch-list .aid{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; letter-spacing:.06em; color:var(--brass);}
  .arch-list .alabel{opacity:.75}
  .arch-list .anote{flex-basis:100%; color:var(--soft); font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px;}
  .arch-list .reopen{
    margin-left:auto; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; font-weight:500;
    letter-spacing:.1em; text-transform:uppercase; padding:4px 10px 3px; cursor:pointer;
    background:transparent; color:var(--soft); border:1px solid var(--line);
  }
  .arch-list .reopen:hover{color:var(--ink); border-color:var(--soft);}
  .arch-list .reopen:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}
  .arch-list .reopen:disabled{cursor:default; opacity:.55}
  .smoke[hidden], .task[hidden], .decision[hidden], .tasks[hidden], details.archive[hidden]{display:none !important}
  .notes ol{margin:0; padding-left:1.5em; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; line-height:1.9; color:var(--soft);}
  .notes li{margin:.3em 0; max-width:80ch;}
  .titleblock{
    margin-top:48px; border:2px solid var(--rule); display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr)); background:var(--card);
  }
  .tb{padding:10px 14px 12px; border-right:1px solid var(--line);}
  .tb:last-child{border-right:0}
  .tb .lab{
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--soft); display:block; margin-bottom:2px;
  }
  .tb .val{font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12.5px; font-weight:500;}
  @media (max-width:640px){ .tb{border-right:0; border-bottom:1px solid var(--line);} .tb:last-child{border-bottom:0} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>

function fullDoc(appSrc){

var MARK_S = "/*__STATE" + "__*/", MARK_E = "/*__END" + "__*/";
function withState(src, st){
  var json = JSON.stringify(st).replace(/</g, "\\u003c");
  var i = src.indexOf(MARK_S), j = src.indexOf(MARK_E);
  if (i < 0 || j < 0) throw new Error("state markers missing");
  return src.slice(0, i + MARK_S.length) + json + src.slice(j);
}

function normSmokes(v){
  var out = {};
  SMOKE_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { s: e.s === "pass" || e.s === "fail" ? e.s : "open", note: String(e.note || ""), at: String(e.at || "") };
  });
  return out;
}
function normTasks(v){
  var out = {};
  TASK_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { s: e.s === "done" ? "done" : "open", at: String(e.at || "") };
  });
  return out;
}
function normWaves(v){
  var out = {};
  WAVE_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { p: e.p === "next" || e.p === "hold" ? e.p : "queued", note: String(e.note || "") };
  });
  return out;
}
function normDecisions(v){
  var out = {};
  DEC_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { pick: DEC_OPTS[id].indexOf(e.pick) >= 0 ? e.pick : "", note: String(e.note || ""), at: String(e.at || "") };
  });
  return out;
}
function normMemo(v){
  var e = v || {};
  return { text: String(e.text || ""), at: String(e.at || "") };
}
function bundle(st){
  return { smokes: st.smokes, tasks: st.tasks, waves: st.waves, decisions: st.decisions, memo: st.memo };
}

  if (note) { var n = document.createElement("span"); n.className = "anote"; n.textContent = "Note: " + note; li.appendChild(n); }

function fillArchive(archId, lines, noun){

function textOf(sel, root){ var el = (root || document).querySelector(sel); return el ? el.textContent.trim() : ""; }

function decorate(){
  var arch = { gate: [], smokes: [], h0: [], dec: [] };
  /* smokes */
  var pass = 0, fail = 0, open = 0;
  SMOKE_IDS.forEach(function(id){
    var e = state.smokes[id];
    var row = document.querySelector('[data-smoke="' + id + '"]');
    if (row) row.setAttribute("data-s", e.s);
    if (row) row.hidden = e.s === "pass";
    if (row && e.s === "pass") arch.smokes.push(archLine("smk", id, id.toUpperCase(), textOf(".name", row), "PASS" + (e.at ? " · " + e.at : ""), "pass", e.note));
    setSeg(null, id, e.s, "data-smk");
    setNoteInput("data-note", id, e.note);
    var stamp = document.querySelector('[data-stamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.s !== "open" ? " " + e.s : "");
      stamp.textContent = e.s === "open" ? "" : e.s.toUpperCase() + (e.at ? " · " + e.at : "");
    }
    if (e.s === "pass") pass++; else if (e.s === "fail") fail++; else open++;
  });
  var count = document.getElementById("smoke-count");
  if (count) count.textContent = pass + " pass · " + fail + " fail · " + open + " open";
  var kpi = document.getElementById("kpi-smokes"), sub = document.getElementById("kpi-smokes-sub");
  if (kpi) kpi.textContent = String(open + fail);
  if (sub) sub.textContent = fail > 0
    ? "unresolved · " + fail + " FAILED · " + pass + " passed"
    : (pass > 0 ? "open · " + pass + " passed" : "open · none marked yet");

  /* tasks (gate + H0) */
  TASK_IDS.forEach(function(id){
    var e = state.tasks[id];
    var row = document.querySelector('[data-task="' + id + '"]');
    if (row) row.setAttribute("data-s", e.s);
    if (row) row.hidden = e.s === "done";
    if (row && e.s === "done") arch[id.indexOf("g-") === 0 ? "gate" : "h0"].push(archLine("tsk", id, id.toUpperCase(), textOf(".tname", row), "DONE" + (e.at ? " · " + e.at : ""), "done", ""));
    setSeg(null, id, e.s, "data-tsk");
    var stamp = document.querySelector('[data-tstamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.s === "done" ? " done" : "");
      stamp.textContent = e.s === "done" ? "DONE" + (e.at ? " · " + e.at : "") : "";
    }
  });
  var gateChip = document.getElementById("gate-chip");
  if (gateChip) {
    var gateDone = state.tasks["g-1"].s === "done" && state.tasks["g-2"].s === "done";
    gateChip.className = "chip " + (gateDone ? "done" : "open");
    gateChip.textContent = gateDone ? "Closed · verified" : "Auto gated · file in place";
  }
  var h0Chip = document.getElementById("h0-chip");
  var h0Wave = document.querySelector('[data-wave="h0"]');
  if (h0Chip && h0Wave) {
    var h0Done = state.tasks["h0-1"].s === "done" && state.tasks["h0-2"].s === "done" && state.tasks["h0-3"].s === "done";
    h0Chip.className = "chip " + (h0Done ? "done" : "hot");
    h0Chip.textContent = h0Done ? "Done" : "Secrets rotation open";
    h0Wave.className = "wave " + (h0Done ? "done" : "hot");
  }

  /* waves */
  WAVE_IDS.forEach(function(id){
    var e = state.waves[id];
    if (PRIO_WAVES.indexOf(id) >= 0) setSeg(null, id, e.p, "data-wav");
    setNoteInput("data-wnote", id, e.note);
  });

  /* decisions */
  var decided = 0;
  DEC_IDS.forEach(function(id){
    var e = state.decisions[id];
    var card = document.querySelector('[data-dec-card="' + id + '"]');
    if (card) card.setAttribute("data-decided", e.pick ? "1" : "0");
    if (card) card.hidden = !!e.pick;
    if (card && e.pick) arch.dec.push(archLine("dec", id, textOf(".did", card), textOf(".q", card), ("DECIDED " + (DEC_TAG[e.pick] || "")).trim() + (e.at ? " · " + e.at : ""), "done", e.note));
    setSeg(null, id, e.pick, "data-dec");
    setNoteInput("data-dnote", id, e.note);
    var stamp = document.querySelector('[data-dstamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.pick ? " done" : "");
      stamp.textContent = e.pick ? ("DECIDED " + (DEC_TAG[e.pick] || "")).trim() + (e.at ? " · " + e.at : "") : "";
    }
    if (e.pick) decided++;
  });
  var dc = document.getElementById("dec-count");
  if (dc) dc.textContent = decided + " / " + DEC_IDS.length + " decided";
  var kd = document.getElementById("kpi-dec"), kds = document.getElementById("kpi-dec-sub");
  if (kd) kd.textContent = String(DEC_IDS.length - decided);
  if (kds) kds.textContent = decided > 0 ? "undecided · " + decided + " decided · + 2 parked" : "undecided · + 2 parked";

  /* memo */
  var memo = document.querySelector("[data-memo]");
  if (memo) { if (memo.value !== state.memo.text) memo.value = state.memo.text; memo.disabled = readOnly; }
  var ms = document.getElementById("memo-stamp");
  if (ms) ms.textContent = state.memo.text ? (state.memo.at ? "memo · " + state.memo.at : "memo drafted") : "empty";

  /* archive strips + empty task lists */
  fillArchive("arch-gate", arch.gate, "done");
  fillArchive("arch-smokes", arch.smokes, "passed");
  fillArchive("arch-h0", arch.h0, "done");
  fillArchive("arch-dec", arch.dec, "decided");
  document.querySelectorAll(".tasks").forEach(function(c){
    var rows = c.querySelectorAll(".task"), all = rows.length > 0;
    rows.forEach(function(r){ if (!r.hidden) all = false; });
    c.hidden = all;
  });

  /* footer + stamp line */
  var stampLine = document.getElementById("save-stamp");
  if (stampLine) stampLine.textContent = state.saved
    ? "Operator state r" + state.rev + " · saved " + fmtWhen(state.saved) + " · marks publish to the sheet when you hit Save."
    : "No revision saved yet — marks publish to the sheet when you hit Save.";
  var tb = document.getElementById("tb-state");
  if (tb) tb.textContent = state.saved ? "r" + state.rev + " · " + fmtDay(state.saved) : "r0 · unsaved";
  syncSavebar();
}

function dirty(){ return JSON.stringify(bundle(state)) !== baseline; }

function syncSavebar(msg){
  var bar = document.getElementById("savebar");
  var m = document.getElementById("save-msg");
  var save = document.getElementById("btn-save");
  var disc = document.getElementById("btn-discard");
  if (!bar) return;
  if (readOnly) {
    bar.classList.add("on");
    m.textContent = "This view is read-only — marks here can’t be saved to the sheet.";
    save.style.display = "none"; disc.style.display = "none";
    return;
  }
  bar.classList.toggle("on", dirty() || busy || !!msg);
  m.textContent = msg || (busy ? "Saving…" : "Unsaved marks — Save publishes them for every viewer, and for Claude.");
  save.disabled = busy; disc.disabled = busy;
  save.textContent = busy ? "Saving…" : "Save to sheet";
}

function stashDraft(){ try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(bundle(state))); } catch (e) {} }
function clearDraft(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function applyBundle(b){
  state.smokes = normSmokes(b.smokes); state.tasks = normTasks(b.tasks);
  state.waves = normWaves(b.waves); state.decisions = normDecisions(b.decisions);
  state.memo = normMemo(b.memo);
}
function restoreDraft(){
  var raw = null;
  try { raw = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
  if (!raw) return;
  if (raw === baseline) { clearDraft(); return; }
  try {
    applyBundle(JSON.parse(raw));
    decorate();
    syncSavebar("Restored unsaved marks from before the last reload — Save to keep them.");
  } catch (e) { clearDraft(); }
}

async function doSave(){
  if (busy || readOnly) return;
  busy = true; syncSavebar();
  stashDraft();
  var cap = null;
  try { cap = await capPromise; } catch (e) { cap = null; }
  if (!cap) {
    busy = false;
    syncSavebar("Saving isn’t available in this view — open the sheet in the Claude artifact viewer to save.");
    return;
  }
  var next = { rev: state.rev + 1, saved: new Date().toISOString(),
               smokes: state.smokes, tasks: state.tasks, waves: state.waves,
               decisions: state.decisions, memo: state.memo };
  try {
    await cap.publish(fullDoc(withState(APP_EL.textContent, next)));
    /* success: the shell reloads this view to the new revision */
  } catch (err) {
    busy = false;
    var code = err && err.code;
    if (code === "conflict") {
      syncSavebar("Someone saved a newer revision first — reloading to it. Your marks were kept and will be offered back.");
    } else if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
      readOnly = true; decorate();
    } else if (code === "rate_limited") {
      syncSavebar("Saving too often — give it a moment, then Save again.");
    } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
      syncSavebar("This sheet’s saving is switched off in this view — marks stay on screen only.");
    } else {
      syncSavebar("Save didn’t land (service hiccup) — try once more.");
    }
  }
}

      decorate();
    });
  });
  document.querySelectorAll("[data-dec]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (readOnly) return;
      var e = state.decisions[btn.getAttribute("data-dec")], v = btn.getAttribute("data-set");
      if (e.pick === v) return;
      e.pick = v; e.at = v ? today() : "";
      decorate();
    });
  });
  document.querySelectorAll("[data-note]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.smokes[inp.getAttribute("data-note")].note = inp.value; syncSavebar();
    });
  });
  document.querySelectorAll("[data-wnote]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.waves[inp.getAttribute("data-wnote")].note = inp.value; syncSavebar();
    });
  });
  document.querySelectorAll("[data-dnote]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.decisions[inp.getAttribute("data-dnote")].note = inp.value; syncSavebar();
    });
  });
  var memo = document.querySelector("[data-memo]");
  if (memo) memo.addEventListener("input", function(){
    if (readOnly) return;
    state.memo.text = memo.value; state.memo.at = today();
    var ms = document.getElementById("memo-stamp");
    if (ms) ms.textContent = state.memo.text ? "memo drafted — unsaved" : "empty";
    syncSavebar();
  });
  document.addEventListener("click", function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-reopen]") : null;
    if (!b || readOnly) return;
    var p = b.getAttribute("data-reopen").split(":"), kind = p[0], id = p[1];
    if (kind === "smk" && state.smokes[id]) { state.smokes[id].s = "open"; state.smokes[id].at = ""; }
    else if (kind === "tsk" && state.tasks[id]) { state.tasks[id].s = "open"; state.tasks[id].at = ""; }
    else if (kind === "dec" && state.decisions[id]) { state.decisions[id].pick = ""; state.decisions[id].at = ""; }
    else return;
    decorate();
  });
  document.getElementById("btn-save").addEventListener("click", doSave);
  document.getElementById("btn-discard").addEventListener("click", function(){
    applyBundle(JSON.parse(baseline));
    clearDraft(); decorate();
  });
}

function boot(){
  ensureAssets();
  var root = document.getElementById("root");
  if (root && !root.firstElementChild) root.innerHTML = BODY;
  bind();
  decorate();
  if (state.saved) {
    var raw = null;
    try { raw = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
    if (raw && raw === baseline) { clearDraft(); syncSavebar("Saved — this sheet is now revision r" + state.rev + "."); setTimeout(function(){ syncSavebar(); }, 4000); }
  }
  restoreDraft();
  capPromise.then(function(cap){
    if (!cap) {
      var chip = document.getElementById("live-chip");
      if (chip) { chip.className = "chip wait"; chip.textContent = "Static view — saving unavailable here"; }
    }
  });
}

/* verification hook: lets a driving session generate the exact document a
   Save would publish, without publishing */
window.__punch = { doc: function(st){ return fullDoc(withState(APP_EL.textContent, st)); },
                   state: function(){ return JSON.parse(JSON.stringify(state)); } };

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
</body>
</html>
