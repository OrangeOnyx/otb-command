      built from HANDOFF.md + the register. Your SMK-6 note (&ldquo;delete items &mdash; confirm every
      one?&rdquo;) was answered Sep 1: L-1 bulk delete landed in c0df4a4, one confirm per batch.</li>
      <li>Sep 4 (later), your pick &ldquo;1&rdquo;: finished items now fold. Pass / Done / Decided drops the
      card into the Archive strip at the foot of its schedule (dated, note kept); Reopen restores it and
      shows the Save bar. Counts and KPIs still include archived items; the saved state is unchanged in
      shape, so every earlier revision reads fine.</li>
      <li>Full AC flat archive (39 tables, md5 manifest, secrets stripped):
      <code>docs/harvest/ac-archive-2026-08-29/</code> + Drive copy under
      <code>G:\\My Drive\\00 OTB\\</code>. Rebuild drill documented in the spec.</li>
      <li>New-capability north star: &ldquo;open Atlas, never open another program&rdquo; &mdash;
      N-1 Matters &amp; Planning, N-2 meeting-notes ingestion, N-3 accounting home ride Wave H2.5.</li>
    </ol>
  </section>

  <footer class="titleblock">
    <div class="tb"><span class="lab">Project</span><span class="val">Orange Ocean Atlas &mdash; OTB Command</span></div>
    <div class="tb"><span class="lab">Sheet</span><span class="val">G-1 &middot; Punch List</span></div>
    <div class="tb"><span class="lab">Date</span><span class="val">2026-09-04</span></div>
    <div class="tb"><span class="lab">Rev</span><span class="val">9</span></div>
    <div class="tb"><span class="lab">Compiled by</span><span class="val">Claude Code</span></div>
    <div class="tb"><span class="lab">Operator state</span><span class="val" id="tb-state">r0 &middot; unsaved</span></div>
  </footer>
</div>

<div class="savebar" id="savebar">
  <span class="msg" id="save-msg" aria-live="polite">Unsaved marks</span>
  <button type="button" id="btn-discard">Discard</button>
  <button type="button" class="primary" id="btn-save">Save to sheet</button>
</div>
`;

/* ------------------------------------------------------------------ */

function ensureAssets(){
  if (!document.getElementById("punch-css")) {
    var l1 = document.createElement("link"); l1.rel = "preconnect"; l1.href = "https://fonts.googleapis.com";
    var l2 = document.createElement("link"); l2.rel = "stylesheet"; l2.href = FONTS;
    var st = document.createElement("style"); st.id = "punch-css"; st.textContent = CSS;
    document.head.appendChild(l1); document.head.appendChild(l2); document.head.appendChild(st);
  }
}

function fullDoc(appSrc){
  return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
    '<title>Atlas Punch List</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
    '<link rel="stylesheet" href="' + FONTS + '">\n' +
    '<style>body{margin:0;background:#EDEFE8}@media (prefers-color-scheme:dark){body{background:#151B18}}</style>\n' +
    '<style id="punch-css">' + CSS + '</style>\n' +
    '</head>\n<body>\n<div id="root"></div>\n' +
    '<script id="app">' + appSrc + '<\/scr' + 'ipt>\n</body>\n</html>';
}

var MARK_S = "/*__STATE" + "__*/", MARK_E = "/*__END" + "__*/";
function withState(src, st){
  var json = JSON.stringify(st).replace(/</g, "\\u003c");
  var i = src.indexOf(MARK_S), j = src.indexOf(MARK_E);
  if (i < 0 || j < 0) throw new Error("state markers missing");
  return src.slice(0, i + MARK_S.length) + json + src.slice(j);
}

function normSmokes(v){
  var out = {};
  SMOKE_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { s: e.s === "pass" || e.s === "fail" ? e.s : "open", note: String(e.note || ""), at: String(e.at || "") };
  });
  return out;
}
function normTasks(v){
  var out = {};
  TASK_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { s: e.s === "done" ? "done" : "open", at: String(e.at || "") };
  });
  return out;
}
function normWaves(v){
  var out = {};
  WAVE_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { p: e.p === "next" || e.p === "hold" ? e.p : "queued", note: String(e.note || "") };
  });
  return out;
}
function normDecisions(v){
  var out = {};
  DEC_IDS.forEach(function(id){
    var e = (v && v[id]) || {};
    out[id] = { pick: DEC_OPTS[id].indexOf(e.pick) >= 0 ? e.pick : "", note: String(e.note || ""), at: String(e.at || "") };
  });
  return out;
}
function normMemo(v){
  var e = v || {};
  return { text: String(e.text || ""), at: String(e.at || "") };
}
function bundle(st){
  return { smokes: st.smokes, tasks: st.tasks, waves: st.waves, decisions: st.decisions, memo: st.memo };
}

var state = {
  rev: STATE.rev || 0, saved: STATE.saved || null,
  smokes: normSmokes(STATE.smokes), tasks: normTasks(STATE.tasks),
  waves: normWaves(STATE.waves), decisions: normDecisions(STATE.decisions),
  memo: normMemo(STATE.memo)
};
var baseline = JSON.stringify(bundle(state));
var readOnly = false, busy = false;
var capPromise = (window.claude && window.claude.use)
  ? window.claude.use("artifact").then(function(ns){ return ns || window.claude.use("self"); })
  : Promise.resolve(null);

function today(){ return new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function fmtDay(iso){ try { return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" }); } catch (e) { return ""; } }
function fmtWhen(iso){ try { return new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }

function setSeg(sel, id, value, attr){
  document.querySelectorAll('[' + attr + '="' + id + '"]').forEach(function(btn){
    btn.setAttribute("aria-pressed", String(btn.getAttribute("data-set") === value));
    btn.disabled = readOnly;
  });
}
function setNoteInput(attr, id, value){
  var inp = document.querySelector('[' + attr + '="' + id + '"]');
  if (inp) { if (inp.value !== value) inp.value = value; inp.disabled = readOnly; }
}

function archLine(kind, id, shown, label, stampText, stampCls, note){
  var li = document.createElement("li");
  var a = document.createElement("span"); a.className = "aid"; a.textContent = shown; li.appendChild(a);
  var l = document.createElement("span"); l.className = "alabel"; l.textContent = label; li.appendChild(l);
  var st = document.createElement("span"); st.className = "stamp " + stampCls; st.textContent = stampText; li.appendChild(st);
  var b = document.createElement("button"); b.type = "button"; b.className = "reopen";
  b.setAttribute("data-reopen", kind + ":" + id); b.textContent = "Reopen"; b.disabled = readOnly; li.appendChild(b);
  if (note) { var n = document.createElement("span"); n.className = "anote"; n.textContent = "Note: " + note; li.appendChild(n); }
  return li;
}
function fillArchive(archId, lines, noun){
  var det = document.getElementById(archId); if (!det) return;
  var ul = det.querySelector(".arch-list"); ul.textContent = "";
  lines.forEach(function(li){ ul.appendChild(li); });
  det.hidden = lines.length === 0;
  var sum = det.querySelector("summary");
  if (sum) sum.textContent = "Archive · " + lines.length + " " + noun + " · Reopen to bring one back";
}
function textOf(sel, root){ var el = (root || document).querySelector(sel); return el ? el.textContent.trim() : ""; }

function decorate(){
  var arch = { gate: [], smokes: [], h0: [], dec: [] };
  /* smokes */
  var pass = 0, fail = 0, open = 0;
  SMOKE_IDS.forEach(function(id){
    var e = state.smokes[id];
    var row = document.querySelector('[data-smoke="' + id + '"]');
    if (row) row.setAttribute("data-s", e.s);
    if (row) row.hidden = e.s === "pass";
    if (row && e.s === "pass") arch.smokes.push(archLine("smk", id, id.toUpperCase(), textOf(".name", row), "PASS" + (e.at ? " · " + e.at : ""), "pass", e.note));
    setSeg(null, id, e.s, "data-smk");
    setNoteInput("data-note", id, e.note);
    var stamp = document.querySelector('[data-stamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.s !== "open" ? " " + e.s : "");
      stamp.textContent = e.s === "open" ? "" : e.s.toUpperCase() + (e.at ? " · " + e.at : "");
    }
    if (e.s === "pass") pass++; else if (e.s === "fail") fail++; else open++;
  });
  var count = document.getElementById("smoke-count");
  if (count) count.textContent = pass + " pass · " + fail + " fail · " + open + " open";
  var kpi = document.getElementById("kpi-smokes"), sub = document.getElementById("kpi-smokes-sub");
  if (kpi) kpi.textContent = String(open + fail);
  if (sub) sub.textContent = fail > 0
    ? "unresolved · " + fail + " FAILED · " + pass + " passed"
    : (pass > 0 ? "open · " + pass + " passed" : "open · none marked yet");

  /* tasks (gate + H0) */
  TASK_IDS.forEach(function(id){
    var e = state.tasks[id];
    var row = document.querySelector('[data-task="' + id + '"]');
    if (row) row.setAttribute("data-s", e.s);
    if (row) row.hidden = e.s === "done";
    if (row && e.s === "done") arch[id.indexOf("g-") === 0 ? "gate" : "h0"].push(archLine("tsk", id, id.toUpperCase(), textOf(".tname", row), "DONE" + (e.at ? " · " + e.at : ""), "done", ""));
    setSeg(null, id, e.s, "data-tsk");
    var stamp = document.querySelector('[data-tstamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.s === "done" ? " done" : "");
      stamp.textContent = e.s === "done" ? "DONE" + (e.at ? " · " + e.at : "") : "";
    }
  });
  var gateChip = document.getElementById("gate-chip");
  if (gateChip) {
    var gateDone = state.tasks["g-1"].s === "done" && state.tasks["g-2"].s === "done";
    gateChip.className = "chip " + (gateDone ? "done" : "open");
    gateChip.textContent = gateDone ? "Closed · verified" : "Auto gated · file in place";
  }
  var h0Chip = document.getElementById("h0-chip");
  var h0Wave = document.querySelector('[data-wave="h0"]');
  if (h0Chip && h0Wave) {
    var h0Done = state.tasks["h0-1"].s === "done" && state.tasks["h0-2"].s === "done" && state.tasks["h0-3"].s === "done";
    h0Chip.className = "chip " + (h0Done ? "done" : "hot");
    h0Chip.textContent = h0Done ? "Done" : "Secrets rotation open";
    h0Wave.className = "wave " + (h0Done ? "done" : "hot");
  }

  /* waves */
  WAVE_IDS.forEach(function(id){
    var e = state.waves[id];
    if (PRIO_WAVES.indexOf(id) >= 0) setSeg(null, id, e.p, "data-wav");
    setNoteInput("data-wnote", id, e.note);
  });

  /* decisions */
  var decided = 0;
  DEC_IDS.forEach(function(id){
    var e = state.decisions[id];
    var card = document.querySelector('[data-dec-card="' + id + '"]');
    if (card) card.setAttribute("data-decided", e.pick ? "1" : "0");
    if (card) card.hidden = !!e.pick;
    if (card && e.pick) arch.dec.push(archLine("dec", id, textOf(".did", card), textOf(".q", card), ("DECIDED " + (DEC_TAG[e.pick] || "")).trim() + (e.at ? " · " + e.at : ""), "done", e.note));
    setSeg(null, id, e.pick, "data-dec");
    setNoteInput("data-dnote", id, e.note);
    var stamp = document.querySelector('[data-dstamp="' + id + '"]');
    if (stamp) {
      stamp.className = "stamp" + (e.pick ? " done" : "");
      stamp.textContent = e.pick ? ("DECIDED " + (DEC_TAG[e.pick] || "")).trim() + (e.at ? " · " + e.at : "") : "";
    }
    if (e.pick) decided++;
  });
  var dc = document.getElementById("dec-count");
  if (dc) dc.textContent = decided + " / 4 decided";
  var kd = document.getElementById("kpi-dec"), kds = document.getElementById("kpi-dec-sub");
  if (kd) kd.textContent = String(DEC_IDS.length - decided);
  if (kds) kds.textContent = decided > 0 ? "undecided · " + decided + " decided · + 2 parked" : "undecided · + 2 parked";

  /* memo */
  var memo = document.querySelector("[data-memo]");
  if (memo) { if (memo.value !== state.memo.text) memo.value = state.memo.text; memo.disabled = readOnly; }
  var ms = document.getElementById("memo-stamp");
  if (ms) ms.textContent = state.memo.text ? (state.memo.at ? "memo · " + state.memo.at : "memo drafted") : "empty";

  /* archive strips + empty task lists */
  fillArchive("arch-gate", arch.gate, "done");
  fillArchive("arch-smokes", arch.smokes, "passed");
  fillArchive("arch-h0", arch.h0, "done");
  fillArchive("arch-dec", arch.dec, "decided");
  document.querySelectorAll(".tasks").forEach(function(c){
    var rows = c.querySelectorAll(".task"), all = rows.length > 0;
    rows.forEach(function(r){ if (!r.hidden) all = false; });
    c.hidden = all;
  });

  /* footer + stamp line */
  var stampLine = document.getElementById("save-stamp");
  if (stampLine) stampLine.textContent = state.saved
    ? "Operator state r" + state.rev + " · saved " + fmtWhen(state.saved) + " · marks publish to the sheet when you hit Save."
    : "No revision saved yet — marks publish to the sheet when you hit Save.";
  var tb = document.getElementById("tb-state");
  if (tb) tb.textContent = state.saved ? "r" + state.rev + " · " + fmtDay(state.saved) : "r0 · unsaved";
  syncSavebar();
}

function dirty(){ return JSON.stringify(bundle(state)) !== baseline; }

function syncSavebar(msg){
  var bar = document.getElementById("savebar");
  var m = document.getElementById("save-msg");
  var save = document.getElementById("btn-save");
  var disc = document.getElementById("btn-discard");
  if (!bar) return;
  if (readOnly) {
    bar.classList.add("on");
    m.textContent = "This view is read-only — marks here can’t be saved to the sheet.";
    save.style.display = "none"; disc.style.display = "none";
    return;
  }
  bar.classList.toggle("on", dirty() || busy || !!msg);
  m.textContent = msg || (busy ? "Saving…" : "Unsaved marks — Save publishes them for every viewer, and for Claude.");
  save.disabled = busy; disc.disabled = busy;
  save.textContent = busy ? "Saving…" : "Save to sheet";
}

function stashDraft(){ try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(bundle(state))); } catch (e) {} }
function clearDraft(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function applyBundle(b){
  state.smokes = normSmokes(b.smokes); state.tasks = normTasks(b.tasks);
  state.waves = normWaves(b.waves); state.decisions = normDecisions(b.decisions);
  state.memo = normMemo(b.memo);
}
function restoreDraft(){
  var raw = null;
  try { raw = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
  if (!raw) return;
  if (raw === baseline) { clearDraft(); return; }
  try {
    applyBundle(JSON.parse(raw));
    decorate();
    syncSavebar("Restored unsaved marks from before the last reload — Save to keep them.");
  } catch (e) { clearDraft(); }
}

async function doSave(){
  if (busy || readOnly) return;
  busy = true; syncSavebar();
  stashDraft();
  var cap = null;
  try { cap = await capPromise; } catch (e) { cap = null; }
  if (!cap) {
    busy = false;
    syncSavebar("Saving isn’t available in this view — open the sheet in the Claude artifact viewer to save.");
    return;
  }
  var next = { rev: state.rev + 1, saved: new Date().toISOString(),
               smokes: state.smokes, tasks: state.tasks, waves: state.waves,
               decisions: state.decisions, memo: state.memo };
  try {
    await cap.publish(fullDoc(withState(APP_EL.textContent, next)));
    /* success: the shell reloads this view to the new revision */
  } catch (err) {
    busy = false;
    var code = err && err.code;
    if (code === "conflict") {
      syncSavebar("Someone saved a newer revision first — reloading to it. Your marks were kept and will be offered back.");
    } else if (code === "not_writer" || code === "not_granted" || code === "consent_required") {
      readOnly = true; decorate();
    } else if (code === "rate_limited") {
      syncSavebar("Saving too often — give it a moment, then Save again.");
    } else if (code === "not_declared" || code === "capability_disabled" || code === "capability_removed") {
      syncSavebar("This sheet’s saving is switched off in this view — marks stay on screen only.");
    } else {
      syncSavebar("Save didn’t land (service hiccup) — try once more.");
    }
  }
}

function bind(){
  document.querySelectorAll("[data-smk]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (readOnly) return;
      var e = state.smokes[btn.getAttribute("data-smk")], v = btn.getAttribute("data-set");
      if (e.s === v) return;
      e.s = v; e.at = v === "open" ? "" : today();
      decorate();
    });
  });
  document.querySelectorAll("[data-tsk]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (readOnly) return;
      var e = state.tasks[btn.getAttribute("data-tsk")], v = btn.getAttribute("data-set");
      if (e.s === v) return;
      e.s = v; e.at = v === "done" ? today() : "";
      decorate();
    });
  });
  document.querySelectorAll("[data-wav]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (readOnly) return;
      var e = state.waves[btn.getAttribute("data-wav")], v = btn.getAttribute("data-set");
      if (e.p === v) return;
      e.p = v;
      decorate();
    });
  });
  document.querySelectorAll("[data-dec]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if (readOnly) return;
      var e = state.decisions[btn.getAttribute("data-dec")], v = btn.getAttribute("data-set");
      if (e.pick === v) return;
      e.pick = v; e.at = v ? today() : "";
      decorate();
    });
  });
  document.querySelectorAll("[data-note]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.smokes[inp.getAttribute("data-note")].note = inp.value; syncSavebar();
    });
  });
  document.querySelectorAll("[data-wnote]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.waves[inp.getAttribute("data-wnote")].note = inp.value; syncSavebar();
    });
  });
  document.querySelectorAll("[data-dnote]").forEach(function(inp){
    inp.addEventListener("input", function(){
      if (readOnly) return;
      state.decisions[inp.getAttribute("data-dnote")].note = inp.value; syncSavebar();
    });
  });
  var memo = document.querySelector("[data-memo]");
  if (memo) memo.addEventListener("input", function(){
    if (readOnly) return;
    state.memo.text = memo.value; state.memo.at = today();
    var ms = document.getElementById("memo-stamp");
    if (ms) ms.textContent = state.memo.text ? "memo drafted — unsaved" : "empty";
    syncSavebar();
  });
  document.addEventListener("click", function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest("[data-reopen]") : null;
    if (!b || readOnly) return;
    var p = b.getAttribute("data-reopen").split(":"), kind = p[0], id = p[1];
    if (kind === "smk" && state.smokes[id]) { state.smokes[id].s = "open"; state.smokes[id].at = ""; }
    else if (kind === "tsk" && state.tasks[id]) { state.tasks[id].s = "open"; state.tasks[id].at = ""; }
    else if (kind === "dec" && state.decisions[id]) { state.decisions[id].pick = ""; state.decisions[id].at = ""; }
    else return;
    decorate();
  });
  document.getElementById("btn-save").addEventListener("click", doSave);
  document.getElementById("btn-discard").addEventListener("click", function(){
    applyBundle(JSON.parse(baseline));
    clearDraft(); decorate();
  });
}

function boot(){
  ensureAssets();
  var root = document.getElementById("root");
  if (root && !root.firstElementChild) root.innerHTML = BODY;
  bind();
  decorate();
  if (state.saved) {
    var raw = null;
    try { raw = sessionStorage.getItem(DRAFT_KEY); } catch (e) {}
    if (raw && raw === baseline) { clearDraft(); syncSavebar("Saved — this sheet is now revision r" + state.rev + "."); setTimeout(function(){ syncSavebar(); }, 4000); }
  }
  restoreDraft();
  capPromise.then(function(cap){
    if (!cap) {
      var chip = document.getElementById("live-chip");
      if (chip) { chip.className = "chip wait"; chip.textContent = "Static view — saving unavailable here"; }
    }
  });
}

/* verification hook: lets a driving session generate the exact document a
   Save would publish, without publishing */
window.__punch = { doc: function(st){ return fullDoc(withState(APP_EL.textContent, st)); },
                   state: function(){ return JSON.parse(JSON.stringify(state)); } };

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
