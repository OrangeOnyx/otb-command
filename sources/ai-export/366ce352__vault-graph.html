    --grid: #e1e0d9; --border: rgba(11,11,11,0.10);

    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  }

    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
      --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
  html, body { margin:0; height:100%; }
  .viz-root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--text-primary);
    display:flex; flex-direction:column; height:100vh;
  }
  header {
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 16px; border-bottom:1px solid var(--grid); background:var(--surface-1);
  }
  header h1 { font-size:15px; font-weight:600; margin:0; }
  header .stats { color:var(--text-secondary); font-size:12.5px; }
  .controls { display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap; }
  .controls select, .controls input[type=search] {
    font:inherit; font-size:12.5px; color:var(--text-primary);
    background:var(--page); border:1px solid var(--grid); border-radius:6px; padding:4px 8px;
  }
  .controls button {
    font:inherit; font-size:12.5px; cursor:pointer; color:var(--text-primary);
    background:var(--page); border:1px solid var(--grid); border-radius:6px; padding:4px 10px;
  }
  #legend {
    display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px;
    background:var(--surface-1); border-bottom:1px solid var(--grid);
  }
  .chip {
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none;
    font-size:12px; color:var(--text-secondary);
    border:1px solid var(--grid); border-radius:999px; padding:3px 10px;
  }
  .chip .dot { width:9px; height:9px; border-radius:50%; }
  .chip.off { opacity:0.35; }
  #stage { flex:1; position:relative; overflow:hidden; }
  svg { display:block; width:100%; height:100%; background:var(--surface-1); }
  .node circle { stroke: var(--surface-1); stroke-width:2px; cursor:pointer; }
  .node text {
    font-size:10.5px; fill:var(--text-secondary); pointer-events:none;
    paint-order:stroke; stroke:var(--surface-1); stroke-width:3px; stroke-linejoin:round;
  }
  .link { stroke: var(--grid); stroke-width:1px; }
  #tooltip {
    position:absolute; display:none; max-width:300px; pointer-events:none; z-index:5;
    background:var(--surface-1); color:var(--text-primary);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    font-size:12px; line-height:1.45; box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  #tooltip .t { font-weight:600; margin-bottom:2px; }
  #tooltip .kv { color:var(--text-secondary); }
</style>
</head>

const GROUPS = ["System", "Orange Ocean", "Projects", "Real Estate", "Personal & Relationships", "Legal & Finance", "Reference & Sources", "Professional"];
const SLOT = {}; GROUPS.forEach((g,i)=>SLOT[g]="var(--s"+(i+1)+")");

const svg = d3.select("svg"), stage = document.getElementById("stage");
const gRoot = svg.append("g");
const tooltip = document.getElementById("tooltip");
let W = stage.clientWidth, H = stage.clientHeight;

const nodes = DATA.nodes, links = DATA.links;
const byId = new Map(nodes.map(n=>[n.id,n]));
const rOf = d => 4 + Math.sqrt(d.deg) * 2.4;

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d=>d.id).distance(46).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-120))
  .force("center", d3.forceCenter(W/2, H/2))
  .force("collide", d3.forceCollide(d=>rOf(d)+3));

const link = gRoot.append("g").selectAll("line").data(links).join("line").attr("class","link");
const node = gRoot.append("g").selectAll("g").data(nodes).join("g").attr("class","node")
  .call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.25).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));
node.append("circle").attr("r",rOf).attr("fill",d=>SLOT[d.group]);
node.append("text").attr("dy",d=>-rOf(d)-4).attr("text-anchor","middle")
  .text(d=>d.title).style("display",d=>d.deg>=6?null:"none");

node.on("mousemove",(e,d)=>{
  tooltip.style.display="block";
  const esc = s => String(s||"—").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  tooltip.innerHTML = '<div class="t">'+esc(d.title)+'</div>'
    + '<div class="kv">'+esc(d.tier)+(d.type?' · '+esc(d.type):'')+'</div>'
    + '<div class="kv">status '+esc(d.status)+' · grade '+esc(d.grade)+' · zone '+esc(d.zone)+'</div>'
    + '<div class="kv">'+d.deg+' link'+(d.deg===1?'':'s')+'</div>';
  const r = stage.getBoundingClientRect();
  tooltip.style.left = Math.min(e.clientX-r.left+14, r.width-310)+"px";
  tooltip.style.top  = Math.min(e.clientY-r.top+10, r.height-90)+"px";
}).on("mouseleave",()=>{ tooltip.style.display="none"; });

sim.on("tick",()=>{
  link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  node.attr("transform",d=>"translate("+d.x+","+d.y+")");
});

const zoom = d3.zoom().scaleExtent([0.25,5]).on("zoom",e=>{
  gRoot.attr("transform",e.transform);
  node.select("text").style("display", d=> (e.transform.k>1.6 || d.deg>=6) ? null : "none");
});
svg.call(zoom);

// ---- legend chips (group toggles) ----
const active = new Set(GROUPS);
const legend = d3.select("#legend");
GROUPS.forEach(g=>{
  legend.append("span").attr("class","chip").attr("role","button").attr("tabindex",0)
    .html('<span class="dot" style="background:'+SLOT[g]+'"></span>'+g)
    .on("click keydown", function(e){
      if(e.type==="keydown" && e.key!==" " && e.key!=="Enter") return;
      if(active.has(g)) active.delete(g); else active.add(g);
      this.classList.toggle("off", !active.has(g));
      applyFilters();
    });
});

// ---- filters ----
function fill(id, label, values){
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">'+label+': all</option>' +
    values.map(v=>'<option>'+v+'</option>').join('');
}
const uniq = k => [...new Set(nodes.map(n=>n[k]).filter(Boolean))].sort();
fill("f-grade","grade",uniq("grade"));
fill("f-status","status",uniq("status"));
fill("f-zone","zone",uniq("zone"));

function applyFilters(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const fg = document.getElementById("f-grade").value;
  const fs = document.getElementById("f-status").value;
  const fz = document.getElementById("f-zone").value;
  const ok = d => active.has(d.group)
    && (!fg || d.grade===fg) && (!fs || d.status===fs) && (!fz || d.zone===fz)
    && (!q || d.title.toLowerCase().includes(q));
  node.attr("opacity", d=>ok(d)?1:0.08);
  link.attr("opacity", d=>(ok(d.source)&&ok(d.target))?0.9:0.05);
  const n = nodes.filter(ok).length;
  document.getElementById("stats").textContent =
    n+" / "+DATA.stats.notes+" notes · "+DATA.stats.links+" links · "+DATA.stats.orphans+" orphans";
}
["q","f-grade","f-status","f-zone"].forEach(id=>
  document.getElementById(id).addEventListener("input",applyFilters));
applyFilters();

// ---- theme toggle (wins over OS setting both ways) ----
document.getElementById("theme").addEventListener("click",()=>{
  const r = document.documentElement;
  const dark = (r.dataset.theme||"") === "dark" ||
    (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
});
addEventListener("resize",()=>{
  W = stage.clientWidth; H = stage.clientHeight;
  sim.force("center", d3.forceCenter(W/2,H/2)).alpha(0.3).restart();
});
</script>
</body>
