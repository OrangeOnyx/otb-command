<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 8px; }
  .scale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; height: 92px; }
  .step { border-radius: 4px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 500; }
</style></head><body class="cc-reset">
  <div class="lbl">[BONE · WARM NEUTRALS · 050 → 500]</div>
  <div class="scale">
    <div class="step" style="background: var(--cc-bone-050); color: var(--cc-bone-500); border: 1px solid var(--cc-border-soft);">050</div>
    <div class="step" style="background: var(--cc-bone-100); color: var(--cc-bone-500); border: 1px solid var(--cc-border-soft);">100</div>
    <div class="step" style="background: var(--cc-bone-200); color: var(--cc-bone-500);">200</div>
    <div class="step" style="background: var(--cc-bone-300); color: var(--cc-cypress-800);">300</div>
    <div class="step" style="background: var(--cc-bone-400); color: #fff;">400</div>
    <div class="step" style="background: var(--cc-bone-500); color: #fff;">500</div>
  </div>
</body></html>
