<!doctype html><html><head><meta charset="utf-8"><title>Proposal Cover — Cypress Command</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400;0,700;0,900;1,400&family=Archivo:wght@400;500;700;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{--paper:#F4EFE2;--deep:#EAE2CD;--ink:#1E1B16;--soft:#5C554A;--rule:#C9BFA8;--cypress:#1E4D3A;--terra:#A44E12;--olive:#49573C;--mustard:#8F6D0C;--oxblood:#8A2F1F;--terra-n:#D2802F}
*{box-sizing:border-box}body{margin:0;background:#d9d3c4;font-family:Archivo,Inter,system-ui,sans-serif;color:var(--ink)}
.page{width:8.5in;height:11in;background:var(--paper);margin:24px auto;position:relative;overflow:hidden}
.slide{width:13.333in;height:7.5in;margin:24px auto;position:relative;overflow:hidden}
.mono{font-family:"Courier Prime",monospace}.serif{font-family:Besley,Georgia,serif}
.eyebrow{font:700 10px/14px Archivo;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.wm{font:800 13px/15px Archivo;letter-spacing:.08em}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:6px}.stripe span:nth-child(1){background:var(--olive)}.stripe span:nth-child(2){background:var(--mustard)}.stripe span:nth-child(3){background:var(--terra)}.stripe span:nth-child(4){background:var(--ink)}
@media print{body{background:none}.page,.slide{margin:0;page-break-after:always}}
.band{position:absolute;left:0;top:0;bottom:0;width:.5in;background:var(--terra)}
.cover{padding:.7in .75in .7in 1.1in;height:100%;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.title{font:700 44px/48px Besley;letter-spacing:-.01em;margin:.25in 0 .15in;max-width:6in}
.photo{flex:1;margin:.3in 0;border:1px solid var(--rule);background:var(--deep) repeating-linear-gradient(135deg,transparent 0 10px,rgba(30,27,22,.06) 10px 11px);position:relative}
.photo::after{content:"PHOTOGRAPH PLACEHOLDER · REAL PLACES. REAL PEOPLE. REAL PROGRESS.";position:absolute;left:14px;bottom:12px;font:700 9px/12px Archivo;letter-spacing:.14em;color:var(--terra)}
.foot{display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:12px;font:400 10px/14px "Courier Prime"}
.foot b{display:block;font:700 12px/16px Archivo;margin-top:4px}
</style></head><body><div class="page"><div class="band"></div><div class="cover">
<div class="top"><div style="display:flex;gap:10px;align-items:center"><svg viewBox="0 0 100 100" width="44" height="44"><path fill-rule="evenodd" fill="#1E1B16" d="M 10 0 H 90 A 10 10 0 0 1 100 10 V 90 A 10 10 0 0 1 90 100 H 10 A 10 10 0 0 1 0 90 V 10 A 10 10 0 0 1 10 0 Z M 22 22 V 78 H 78 V 61 H 100 V 42 H 78 V 22 Z M 34 34 V 66 H 66 V 34 Z"/></svg><div class="wm">CYPRESS<br>COMMAND</div></div><div class="mono" style="font-size:10px;text-align:right;line-height:14px">CONFIDENTIAL<br>SEPT 2026</div></div>
<div class="eyebrow" style="margin-top:1.4in">Proposal</div>
<div class="title">AI Operating System for On The Boulevard</div>
<div class="mono" style="font-size:11px;line-height:16px;color:var(--soft)">PEOPLE. PROCESSES. PLACES.<br>A MORE CAPABLE TOMORROW.</div>
<div class="photo"></div>
<div class="foot"><div>PREPARED FOR<b>Belle Realty of Lafayette, LLC</b></div><div style="text-align:right">PREPARED BY<b>Cypress Command</b></div></div>
</div></div></body></html>
