<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 22px 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 8px; }
  .box { height: 72px; background: var(--cc-bg-elevated); border: 1px solid var(--cc-border-soft); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--cc-fg-muted); }
</style></head><body class="cc-reset">
  <div class="lbl">[SHADOWS · CYPRESS TINT]</div>
  <div class="row">
    <div class="box" style="box-shadow: var(--cc-shadow-xs);">XS</div>
    <div class="box" style="box-shadow: var(--cc-shadow-sm);">SM</div>
    <div class="box" style="box-shadow: var(--cc-shadow-md);">MD</div>
    <div class="box" style="box-shadow: var(--cc-shadow-lg);">LG</div>
  </div>
</body></html>
