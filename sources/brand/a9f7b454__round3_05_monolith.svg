<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <rect width="300" height="320" fill="#F3EDE0"/>
  <!-- 05 MONOLITH — solid stamp block, C carved out. Pushed further into "stamp" territory. -->
  <g transform="translate(45, 30)">
    <!-- Solid slab -->
    <rect x="0" y="0" width="210" height="180" fill="#1E4D3A"/>
    <!-- C carved out of the slab (bone-colored negative space) -->
    <path d="M 30 30 L 180 30 L 180 66 L 66 66 L 66 114 L 180 114 L 180 150 L 30 150 Z" fill="#F3EDE0"/>
    <!-- Chip sits inside the C's counter (moss) -->
    <rect x="122" y="76" width="42" height="28" fill="#2F6B4E"/>
    <!-- Amber pin -->
    <rect x="138" y="86" width="10" height="8" fill="#D97706"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="252" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="700" fill="#0A1F16" text-anchor="middle" letter-spacing="0.16em">CYPRESS</text>
  <text x="150" y="284" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="700" fill="#0A1F16" text-anchor="middle" letter-spacing="0.16em">COMMAND</text>
  <text x="150" y="306" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5A6B62" text-anchor="middle" letter-spacing="0.28em">05 · MONOLITH</text>
</svg>
