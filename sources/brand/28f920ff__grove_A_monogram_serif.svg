<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 160">
  <rect width="460" height="160" fill="#F3EDE0"/>
  <!-- Interlocked serif CC monogram — heritage, engraved feel -->
  <g transform="translate(30, 30)">
    <!-- Back C -->
    <text x="0" y="82" font-family="Fraunces, 'Playfair Display', Georgia, serif" font-size="120" font-weight="500" fill="#1E4D3A" font-style="normal">C</text>
    <!-- Front C, offset & overlapping -->
    <text x="42" y="98" font-family="Fraunces, 'Playfair Display', Georgia, serif" font-size="120" font-weight="500" fill="#78522A">C</text>
  </g>
  <!-- Wordmark -->
  <line x1="180" y1="55" x2="180" y2="115" stroke="#1E4D3A" stroke-width="1.5"/>
  <text x="196" y="78" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1E4D3A" letter-spacing="0.08em">CYPRESS</text>
  <text x="196" y="106" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="600" fill="#1E4D3A" letter-spacing="0.08em">COMMAND</text>
  <text x="196" y="128" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="500" fill="#78522A" letter-spacing="0.2em">EST. HERITAGE PROPERTIES</text>
</svg>
