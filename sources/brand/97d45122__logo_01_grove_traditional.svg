<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <rect width="400" height="160" fill="#F3EDE0"/>
  <!-- Icon tile: nested traditional curved C's -->
  <rect x="20" y="20" width="120" height="120" rx="22" fill="#1E4D3A"/>
  <!-- Outer C: full 3/4 circular arc, open on the right -->
  <path d="M 92 32 A 36 36 0 1 0 92 128" fill="none" stroke="#F3EDE0" stroke-width="12" stroke-linecap="round"/>
  <!-- Inner C: smaller concentric curved C -->
  <path d="M 80 56 A 20 20 0 1 0 80 104" fill="none" stroke="#F3EDE0" stroke-width="9" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="160" y="72" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="800" fill="#1E4D3A" letter-spacing="-0.02em">CYPRESS</text>
  <text x="160" y="108" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="800" fill="#1E4D3A" letter-spacing="-0.02em">COMMAND<tspan fill="#D97706">.</tspan></text>
  <text x="160" y="132" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500" fill="#78522A" letter-spacing="0.14em">[GROVE · TRADITIONAL C]</text>
</svg>
