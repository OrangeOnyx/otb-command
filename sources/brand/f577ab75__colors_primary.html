<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sw { border-radius: 8px; padding: 14px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--cc-border-soft); }
  .name { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; font-weight: 600; }
  .hex { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; }
</style></head><body class="cc-reset">
  <div class="row">
    <div class="sw" style="background: var(--cc-cypress-700); color: var(--cc-bone-100);"><span class="name">Cypress</span><span class="hex">#1E4D3A</span></div>
    <div class="sw" style="background: var(--cc-amber-500); color: #fff;"><span class="name">Command Amber</span><span class="hex">#D97706</span></div>
    <div class="sw" style="background: var(--cc-bone-100); color: var(--cc-cypress-800);"><span class="name">Bone</span><span class="hex">#F3EDE0</span></div>
    <div class="sw" style="background: var(--cc-slate); color: var(--cc-sage);"><span class="name">Slate</span><span class="hex">#0E1F19</span></div>
    <div class="sw" style="background: var(--cc-sage); color: var(--cc-cypress-800);"><span class="name">Sage</span><span class="hex">#8AA694</span></div>
    <div class="sw" style="background: var(--cc-bayou-500); color: var(--cc-bone-100);"><span class="name">Bayou</span><span class="hex">#78522A</span></div>
    <div class="sw" style="background: var(--cc-moss); color: #fff;"><span class="name">Moss</span><span class="hex">#2F6B4E</span></div>
    <div class="sw" style="background: #fff; color: var(--cc-cypress-800);"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
  </div>
</body></html>
