<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 20px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { aspect-ratio: 1.5; border-radius: 6px; overflow: hidden; position: relative; border: 1px solid var(--cc-border-soft); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { position: absolute; bottom: 6px; left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.14em; color: var(--cc-fg-muted); background: rgba(243,237,224,.85); padding: 2px 5px; border-radius: 3px; }
  .tile.dark .cap { color: var(--cc-sage); background: rgba(14,31,25,.7); }
</style></head><body class="cc-reset">
  <div class="lbl">[PATTERNS · 4 TILES]</div>
  <div class="grid">
    <div class="tile"><img src="../assets/patterns/pattern_a_topo.jpg"/><div class="cap">[A · TOPO]</div></div>
    <div class="tile"><img src="../assets/patterns/pattern_b_bracket.jpg"/><div class="cap">[B · BRACKET]</div></div>
    <div class="tile dark"><img src="../assets/patterns/pattern_c_grove.jpg"/><div class="cap">[C · GROVE]</div></div>
    <div class="tile"><img src="../assets/patterns/pattern_d_ledger.jpg"/><div class="cap">[D · LEDGER]</div></div>
  </div>
</body></html>
