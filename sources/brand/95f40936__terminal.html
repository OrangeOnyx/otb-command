<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 20px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 10px; }
  .term { background: var(--cc-slate); border: 1px solid var(--cc-border-terminal); border-radius: 10px; padding: 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6; color: var(--cc-sage); }
  .prompt { display: flex; gap: 10px; margin-bottom: 4px; }
  .prompt .p { color: var(--cc-amber-400); }
  .prompt .t { color: var(--cc-bone-100); }
  .out { margin-left: 20px; color: var(--cc-sage); margin-bottom: 2px; }
  .meta { margin-left: 20px; color: rgba(138,166,148,.55); font-size: 11px; }
</style></head><body class="cc-reset">
  <div class="lbl">[TERMINAL · AI CONSOLE]</div>
  <div class="term">
    <div class="prompt"><span class="p">▸</span><span class="t">Reconcile Kaliste Court ledger · August 2026.</span></div>
    <div class="out">Reading rent roll · 21 tenants · $142,340 expected.</div>
    <div class="out">Matched 20 of 21 payments. 1 flagged.</div>
    <div class="meta">  ▸ Delta Home Goods · $4,080 · 3 days late.</div>
  </div>
</body></html>
