<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 8px; }
  .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; height: 92px; }
  .step { border-radius: 4px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 500; }
</style></head><body class="cc-reset">
  <div class="lbl">[CYPRESS SCALE · 050 → 950]</div>
  <div class="scale">
    <div class="step" style="background: var(--cc-cypress-050); color: var(--cc-cypress-800);">050</div>
    <div class="step" style="background: var(--cc-cypress-100); color: var(--cc-cypress-800);">100</div>
    <div class="step" style="background: var(--cc-cypress-200); color: var(--cc-cypress-800);">200</div>
    <div class="step" style="background: var(--cc-cypress-300); color: var(--cc-cypress-900);">300</div>
    <div class="step" style="background: var(--cc-cypress-400); color: #fff;">400</div>
    <div class="step" style="background: var(--cc-cypress-500); color: #fff;">500</div>
    <div class="step" style="background: var(--cc-cypress-600); color: #fff;">600</div>
    <div class="step" style="background: var(--cc-cypress-700); color: #fff;">700</div>
    <div class="step" style="background: var(--cc-cypress-800); color: #fff;">800</div>
    <div class="step" style="background: var(--cc-cypress-900); color: var(--cc-sage);">900</div>
    <div class="step" style="background: var(--cc-cypress-950); color: var(--cc-sage);">950</div>
  </div>
</body></html>
