<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 16px 20px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .cap { position: absolute; bottom: 6px; left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.14em; color: var(--cc-sage); }
</style></head><body class="cc-reset">

    <div class="tile"><img src="../assets/photography/shopping_center_dusk.jpg"/><div class="cap">[CENTER · DUSK]</div></div>
    <div class="tile"><img src="../assets/photography/operator_walking_site.jpg"/><div class="cap">[OPERATOR · SITE]</div></div>
    <div class="tile"><img src="../assets/photography/aerial_portfolio.jpg"/><div class="cap">[AERIAL · PORTFOLIO]</div></div>
    <div class="tile"><img src="../assets/photography/ledger_and_keys.jpg"/><div class="cap">[LEDGER · KEYS]</div></div>
    <div class="tile"><img src="../assets/photography/boardroom_dusk.jpg"/><div class="cap">[BOARDROOM · DUSK]</div></div>
  </div>
</body></html>
