<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .sw { border-radius: 8px; padding: 14px; height: 90px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
  .h { font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.75; }
</style></head><body class="cc-reset">
  <div class="lbl">[SEMANTIC · STATUS]</div>
  <div class="row">
    <div class="sw" style="background: var(--cc-success);"><span class="n">Success</span><span class="h">#2F6B4E</span></div>
    <div class="sw" style="background: var(--cc-warning);"><span class="n">Warning</span><span class="h">#D97706</span></div>
    <div class="sw" style="background: var(--cc-danger);"><span class="n">Danger</span><span class="h">#9B3E2B</span></div>
    <div class="sw" style="background: var(--cc-info);"><span class="n">Info</span><span class="h">#45865F</span></div>
  </div>
</body></html>
