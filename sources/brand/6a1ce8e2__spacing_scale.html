<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 20px 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }

  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .n { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--cc-fg-muted); width: 60px; }
  .bar { height: 12px; background: var(--cc-cypress-700); border-radius: 2px; }
</style></head><body class="cc-reset">
  <div class="lbl">[SPACING · 4PT BASE]</div>

  <div class="row"><span class="n">--cc-s-6</span><div class="bar" style="width: 24px;"></div><span class="n">24px</span></div>
  <div class="row"><span class="n">--cc-s-8</span><div class="bar" style="width: 32px;"></div><span class="n">32px</span></div>
  <div class="row"><span class="n">--cc-s-12</span><div class="bar" style="width: 48px;"></div><span class="n">48px</span></div>
  <div class="row"><span class="n">--cc-s-16</span><div class="bar" style="width: 64px;"></div><span class="n">64px</span></div>
  <div class="row"><span class="n">--cc-s-24</span><div class="bar" style="width: 96px;"></div><span class="n">96px</span></div>
</body></html>
