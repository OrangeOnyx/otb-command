<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 22px 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .box { height: 72px; background: var(--cc-cypress-700); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px; color: var(--cc-bone-100); font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; }
</style></head><body class="cc-reset">
  <div class="lbl">[RADII · SHARP EDITORIAL]</div>
  <div class="row">
    <div class="box" style="border-radius: 0;">0 / NONE</div>
    <div class="box" style="border-radius: 2px;">2 / XS</div>
    <div class="box" style="border-radius: 6px;">6 / MD</div>
    <div class="box" style="border-radius: 10px;">10 / LG</div>
    <div class="box" style="border-radius: 16px;">16 / XL</div>
    <div class="box" style="border-radius: 9999px;">∞ / FULL</div>
  </div>
</body></html>
