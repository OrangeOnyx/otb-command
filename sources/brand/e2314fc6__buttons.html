<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 22px 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  button { padding: 11px 20px; border-radius: 6px; font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.02em; cursor: pointer; border: 0; display: inline-flex; align-items: center; gap: 8px; }
  .primary { background: var(--cc-amber-500); color: #fff; box-shadow: 0 2px 8px rgba(217,119,6,.24); }
  .cypress { background: var(--cc-cypress-700); color: #fff; }
  .secondary { background: transparent; color: var(--cc-cypress-800); border: 1.5px solid var(--cc-cypress-800); }
  .ghost { background: transparent; color: var(--cc-cypress-700); }
  .dark { background: var(--cc-slate); color: #fff; }
</style></head><body class="cc-reset">
  <div class="lbl">[BUTTONS · 5 VARIANTS]</div>
  <div class="row">
    <button class="primary">Request access →</button>
    <button class="cypress">Apply to The Grove</button>
    <button class="secondary">See how it works</button>
    <button class="ghost">Cancel</button>
    <button class="dark">Book a call</button>
  </div>
</body></html>
