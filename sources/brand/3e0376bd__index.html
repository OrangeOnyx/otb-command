<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Cypress Command — The operating system for real-world businesses.</title>
  <link rel="stylesheet" href="../../colors_and_type.css"/>
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: var(--cc-bg-page); font-family: 'Inter', sans-serif; color: var(--cc-fg-primary); -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }

    /* Tweak-driven overrides. These re-map the base --cc-* tokens so every
       component inherits the change without needing to know about tweaks. */
    :root {
      --tk-radius-scale: 1;
      --tk-cta-color: #D97706;
      --tk-cta-color-hover: #C06805;
      --tk-cta-color-press: #A85D04;
      --tk-cypress: #1E4D3A;
      --tk-cypress-deep: #0E1F19;
      --tk-cypress-mid: #14372A;
    }

    /* Radius sharpness — 0 = razor sharp, 1 = default, 2 = pillowy */
    :root {
      --cc-r-xs:   calc(2px  * var(--tk-radius-scale));
      --cc-r-sm:   calc(4px  * var(--tk-radius-scale));
      --cc-r-md:   calc(6px  * var(--tk-radius-scale));
      --cc-r-lg:   calc(10px * var(--tk-radius-scale));
      --cc-r-xl:   calc(16px * var(--tk-radius-scale));
    }

    /* Palette re-mapping so tweaks propagate through --cc-cypress-* semantics */
    :root {
      --cc-amber-400: color-mix(in oklab, var(--tk-cta-color) 78%, white);
      --cc-amber-500: var(--tk-cta-color);
      --cc-amber-600: var(--tk-cta-color-hover);
      --cc-amber-700: var(--tk-cta-color-press);
      --cc-cypress-700: var(--tk-cypress);
      --cc-cypress-800: var(--tk-cypress-mid);
      --cc-cypress-900: var(--tk-cypress-deep);
      --cc-cypress-950: color-mix(in oklab, var(--tk-cypress-deep) 85%, black);
      --cc-slate: var(--tk-cypress-deep);
    }

    /* Inline element radius overrides that used px directly */
    button { border-radius: var(--cc-r-md) !important; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="cc-reset">
  <div id="root"></div>

  <script type="text/babel" src="../../components/tweaks_panel.jsx"></script>
  <script type="text/babel" src="../../components/Atoms.jsx"></script>
  <script type="text/babel" src="../../components/Chrome.jsx"></script>
  <script type="text/babel" src="../../components/Data.jsx"></script>
  <script type="text/babel" src="../../components/Sections.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Tweakable defaults. The block between the markers is valid JSON that the
    // host rewrites when the user changes a value.
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "cornerStyle": 1.0,
      "palette": ["#1E4D3A", "#D97706", "#F3EDE0", "#0E1F19"],
      "heroOrientation": "left",
      "pillarLayout": "columns",
      "howLayout": "row",
      "groveOrientation": "text-left",
      "headlineWeight": "italic-amber",
      "showBracketMeta": true
    }/*EDITMODE-END*/;

    // Curated palettes — each is [cypress, amber, bone, slate]
    const PALETTES = [
      ["#1E4D3A", "#D97706", "#F3EDE0", "#0E1F19"], // Cypress Grove (default)
      ["#0B3B2E", "#E8A317", "#F5EFE1", "#050F0B"], // Deep Forest + Brass
      ["#1F3D2A", "#B94A2B", "#EFE9DA", "#0A1810"], // Cypress + Oxblood
      ["#284B44", "#C8963A", "#F3EEE3", "#0C1D19"], // Sage Green + Antique Gold
      ["#132D24", "#5F8FBE", "#EEE9DD", "#050E0B"], // Cypress + Bayou Sky
      ["#3D2A1E", "#D97706", "#F3EDE0", "#180F08"]  // Bayou Bark + Amber (warm)
    ];



    // Apply tweaks to CSS root
    function applyTweaks(t) {
      const r = document.documentElement.style;
      // Radius
      r.setProperty('--tk-radius-scale', t.cornerStyle);
      // Palette
      const [cypress, amber, bone, slate] = t.palette;
      r.setProperty('--tk-cypress', cypress);
      // derive deeper shades for header/dark surfaces
      r.setProperty('--tk-cypress-deep', slate);
      r.setProperty('--tk-cypress-mid', mixShade(cypress, slate, 0.45));
      r.setProperty('--tk-cta-color', amber);
      r.setProperty('--tk-cta-color-hover', mixShade(amber, '#000000', 0.15));
      r.setProperty('--tk-cta-color-press', mixShade(amber, '#000000', 0.30));
      // Bone page bg
      r.setProperty('--cc-bg-page', bone);
      r.setProperty('--cc-bg-surface', mixShade(bone, '#FFFFFF', 0.35));
    }

    // Simple hex mix in linear space
    function mixShade(a, b, t) {
      const parse = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
      const [ar,ag,ab] = parse(a);
      const [br,bg,bb] = parse(b);
      const r = Math.round(ar*(1-t) + br*t);
      const g = Math.round(ag*(1-t) + bg*t);
      const bl = Math.round(ab*(1-t) + bb*t);
      return '#' + [r,g,bl].map(n => n.toString(16).padStart(2,'0')).join('');
    }

    function App() {
      const [route, setRoute] = useState('home');
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

      useEffect(() => { applyTweaks(tweaks); }, [tweaks]);

      // Route palette + orientation into components via context props
      const heroProps = { orientation: tweaks.heroOrientation, showMeta: tweaks.showBracketMeta, headlineStyle: tweaks.headlineWeight };
      const pillarProps = { layout: tweaks.pillarLayout };
      const howProps = { layout: tweaks.howLayout };
      const groveProps = { orientation: tweaks.groveOrientation };

      return (
        <div>
          <MarketingHeader current={route} onNav={setRoute} />
          <Hero {...heroProps} />
          <PositioningTriangle {...pillarProps} />
          <HowItWorks {...howProps} />
          <GroveSection {...groveProps} />
          <TrustBar />
          <ClosingBanner headlineStyle={tweaks.headlineWeight} />
          <MarketingFooter />

          <TweaksPanel title="Tweaks">
            <TweakSuggestionBar suggestions={[
              "Sharpen every corner and switch to the Oxblood palette.",
              "Rotate the Grove section so the roster is on the left.",
              "Try the Sage + Antique Gold palette with pillowy corners.",
              "Flip the hero to right-aligned and hide the bracket meta ticker.",
              "Stack the pillars vertically instead of three columns."
            ]}/>

            <TweakSection title="Corners">
              <TweakSlider
                label="Corner sharpness"
                value={tweaks.cornerStyle}
                onChange={(v) => setTweak('cornerStyle', v)}
                min={0} max={2.4} step={0.1}
                format={(v) => v < 0.2 ? 'Razor sharp' : v < 0.7 ? 'Sharp' : v < 1.3 ? 'Editorial (default)' : v < 1.9 ? 'Soft' : 'Pillowy'}
              />
            </TweakSection>

            <TweakSection title="Palette">
              <TweakColor
                label="Brand palette"
                value={tweaks.palette}
                onChange={(v) => setTweak('palette', v)}
                options={PALETTES}
              />
            </TweakSection>

            <TweakSection title="Hero">
              <TweakRadio
                label="Alignment"
                value={tweaks.heroOrientation}
                onChange={(v) => setTweak('heroOrientation', v)}
                options={[
                  { value: 'left', label: 'Left' },
                  { value: 'center', label: 'Center' },
                  { value: 'right', label: 'Right' }
                ]}
              />
              <TweakSelect
                label="Headline style"
                value={tweaks.headlineWeight}
                onChange={(v) => setTweak('headlineWeight', v)}
                options={[
                  { value: 'italic-amber', label: 'Italic + amber emphasis (default)' },
                  { value: 'roman-only',   label: 'Roman only (no italic)' },
                  { value: 'italic-white', label: 'Italic + white emphasis' },
                  { value: 'amber-all',    label: 'All amber' }
                ]}
              />
              <TweakToggle
                label="Bracket meta ticker"
                value={tweaks.showBracketMeta}
                onChange={(v) => setTweak('showBracketMeta', v)}
              />
            </TweakSection>

            <TweakSection title="Layout">
              <TweakRadio
                label="Positioning pillars"
                value={tweaks.pillarLayout}
                onChange={(v) => setTweak('pillarLayout', v)}
                options={[
                  { value: 'columns', label: '3 col' },
                  { value: 'stacked', label: 'Stacked' }
                ]}
              />
              <TweakRadio
                label="How it works"
                value={tweaks.howLayout}
                onChange={(v) => setTweak('howLayout', v)}
                options={[
                  { value: 'row',     label: '4 col row' },
                  { value: 'grid',    label: '2×2 grid' }
                ]}
              />
              <TweakRadio
                label="Grove orientation"
                value={tweaks.groveOrientation}
                onChange={(v) => setTweak('groveOrientation', v)}
                options={[
                  { value: 'text-left',  label: 'Text L' },
                  { value: 'text-right', label: 'Text R' }
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
