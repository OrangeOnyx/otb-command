<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 18px 24px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col h4 { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 8px; }
  .col.do h4 { color: var(--cc-cypress-600); }
  .col.dont h4 { color: var(--cc-danger); }
  .item { font-family: Inter, sans-serif; font-size: 13px; line-height: 1.45; color: var(--cc-fg-primary); padding: 6px 0; border-bottom: 1px solid var(--cc-border-soft); }
</style></head><body class="cc-reset">
  <div class="lbl">[VOICE · DOs / DON'Ts]</div>
  <div class="row">
    <div class="col do">
      <h4>[DO]</h4>
      <div class="item">"94.2% occupancy — audited monthly."</div>
      <div class="item">"Signed. Filed. Closed."</div>
      <div class="item">"Ground truth. Delivered."</div>
    </div>
    <div class="col dont">
      <h4>[DON'T]</h4>
      <div class="item">"Leverage our platform to unlock value."</div>
      <div class="item">"AMAZING new feature you NEED!" 🚀</div>
      <div class="item">"Reach out and let us know your thoughts!"</div>
    </div>
  </div>
</body></html>
