<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320">
  <rect width="300" height="320" fill="#F3EDE0"/>
  <!-- 01 FOUNDATION C — bold geometric C with chip aligned to the counter -->
  <g transform="translate(60, 30)">
    <!-- C: a thick ring with the right side cut open -->
    <!-- Outer square-ish disc -->
    <path d="M 90 0
             A 90 90 0 1 0 90 180
             L 90 140
             A 50 50 0 1 1 90 40
             Z" fill="#1E4D3A"/>
    <!-- Chip: aligned inside the C's inner counter, sits on the right edge of the counter -->
    <rect x="70" y="76" width="28" height="28" fill="#2F6B4E"/>
    <!-- Amber signal notch — tiny -->
    <rect x="82" y="88" width="4" height="4" fill="#D97706"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="252" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="700" fill="#0A1F16" text-anchor="middle" letter-spacing="0.16em">CYPRESS</text>
  <text x="150" y="284" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="700" fill="#0A1F16" text-anchor="middle" letter-spacing="0.16em">COMMAND</text>
  <text x="150" y="306" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5A6B62" text-anchor="middle" letter-spacing="0.28em">01 · FOUNDATION</text>
</svg>
