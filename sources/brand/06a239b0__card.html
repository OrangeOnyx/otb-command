<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  body { margin: 0; padding: 20px; background: var(--cc-bg-page); font-family: Inter, sans-serif; }
  .card { background: var(--cc-bg-elevated); border: 1px solid var(--cc-border-soft); border-radius: 10px; box-shadow: var(--cc-shadow-sm); padding: 20px; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); margin-bottom: 8px; }
  .value { font-family: Fraunces, serif; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; color: var(--cc-fg-strong); line-height: 1; }
  .delta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #2F6B4E; margin-left: 8px; letter-spacing: 0.06em; }
  .ledger { margin-top: 20px; padding-top: 10px; border-top: 1px solid var(--cc-border-soft); display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cc-fg-muted); }
</style></head><body class="cc-reset">
  <div class="card">
    <div class="eyebrow">[PORTFOLIO OCCUPANCY]</div>
    <div><span class="value">94.2%</span><span class="delta">▲ +0.8 pt</span></div>
    <div class="ledger"><span>Audited monthly</span><span>↑ vs Q2</span></div>
  </div>
</body></html>
