# A-3 voice bridge — Fly.io config. Deploy from THIS folder:
#   cd bridge && flyctl launch --copy-config --no-deploy && flyctl deploy
# Region dfw = Dallas, closest to Lafayette LA for call latency.
# min_machines_running=1: a cold start would eat the first seconds of a call.
app = "otb-voice-bridge"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "4s"
  method = "GET"
  path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
