# B-4 CI tripwire (docs/phase-b/11): test + build verify on every push/PR.
# Deliberately NOT a deploy pipeline — deploys stay manual (`vercel deploy
# --prod`) until the operator closes the Vercel git-link decision.
# Build runs env-less: remote.js falls back to local-only without VITE_* keys,
# so no secrets live in CI.
name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
